name: Build & Package .levipack

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja and Python
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: Setup Android SDK & NDK 28.2.13676358
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.2.13676358
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Generate typed config on host
        run: |
          cmake -S . -B build-config -G Ninja
          cmake --build build-config --target levi_generate_config

      - name: Build and package (${{ matrix.abi }})
        run: |
          cmake -S . -B "build-${{ matrix.abi }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DLEVI_PACKAGE_CONFIG_DIR="$PWD/build-config/generated-config"
          cmake --build "build-${{ matrix.abi }}" --target levi_package

      - name: Validate .levipack artifact
        run: |
          PACK="$(find "build-${{ matrix.abi }}" -maxdepth 1 -name '*.levipack' | head -n 1)"
          python3 tools/validate_levipack.py "$PACK"

      - name: Upload .levipack artifact
        uses: actions/upload-artifact@v4
        with:
          name: levipack-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/*.levipack

      - name: Attach .levipack to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-${{ matrix.abi }}/*.levipack